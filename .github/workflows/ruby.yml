name: Ruby

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build h2.gemspec --output ruby-h2database.gem
      - run: bundle exec h2 --execute 'SELECT 1 AS smoke;'

  reference:
    name: Ruby ${{ matrix.ruby }} vs H2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: h2/pom.xml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: mvn -q -f h2/pom.xml -DskipTests package
      - run: bundle exec rake test:reference
